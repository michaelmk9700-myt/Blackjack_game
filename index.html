<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blackjack Royale</title>
<style>
:root{font-family:system-ui,Arial;color:#fff;background:#071d1b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at center,#17664d,#092c27 70%,#041714)}main{max-width:950px;margin:auto;padding:18px;text-align:center}h1{color:#f8d77a;letter-spacing:3px;margin:10px}.status{color:#f8d77a;min-height:28px;font-weight:700}.table{border:8px solid #8b5d2d;border-radius:45% 45% 25% 25%/18% 18% 12% 12%;padding:20px 10px 30px;min-height:390px;box-shadow:0 15px 30px #0008,inset 0 0 30px #0005}.hand{display:flex;justify-content:center;gap:8px;min-height:118px;margin:8px 0 18px;flex-wrap:wrap}.card{background:#fff;color:#182323;border-radius:9px;width:72px;height:105px;padding:8px;text-align:left;font-weight:900;font-size:21px;box-shadow:2px 4px 8px #0006;display:flex;flex-direction:column;justify-content:space-between;}.red{color:#d33239}.back{background:repeating-linear-gradient(45deg,#193e83,#193e83 6px,#2c64a2 6px,#2c64a2 12px);border:5px solid white}.bottom{transform:rotate(180deg)}@keyframes deal{from{opacity:0;transform:translate(85px,-95px) rotate(-13deg) scale(.92)}to{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}.card.arriving{animation:deal .62s cubic-bezier(.18,.7,.2,1) both}@media(prefers-reduced-motion:reduce){.card.arriving{animation:none}}button{background:linear-gradient(#f7d77c,#b8862c);border:0;border-radius:12px;padding:13px 19px;margin:5px;color:#17251d;font-weight:800;cursor:pointer;font-size:16px}button:disabled{opacity:.35;cursor:not-allowed}.stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin:15px}.controls{margin:16px}input{width:85px;background:#fff;color:#111;border-radius:8px;padding:10px;border:0;font-size:17px}small{color:#c4d8d0}h3{margin:7px}</style></head>
<body><main><h1>♠ BLACKJACK ROYALE ♥</h1><div class="stats"><span>🪙 Coins: <b id="balance"></b></span><span>Bet: <b id="currentBet">0</b></span><span>Wins: <b id="wins"></b></span></div><div class="table"><h3>DEALER <span id="dealerScore"></span></h3><div class="hand" id="dealer"></div><p class="status" id="message" aria-live="polite">Place your bet to start</p><h3>YOU <span id="playerScore"></span></h3><div class="hand" id="player"></div></div><div class="controls"><label>Bet <input type="number" id="bet" min="10" step="10" value="50"></label><button id="dealBtn">DEAL</button><button id="hitBtn" disabled>HIT</button><button id="standBtn" disabled>STAND</button><button id="doubleBtn" disabled>DOUBLE</button><button id="soundBtn" aria-pressed="true">🔊 SOUND ON</button></div><small>Virtual coins only • Dealer stands on 17 • Blackjack pays 3:2 • No real-money wagering</small></main>
<script>
'use strict';
const $=id=>document.getElementById(id),KEY='blackjack-royale-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch{}
let balance=Number.isFinite(saved.balance)?Math.max(0,saved.balance):1000,wins=Number.isFinite(saved.wins)?saved.wins:0,bet=0,deck=[],player=[],dealer=[],active=false,busy=false,arrival=null,soundOn=true,audio=null;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function sound(){if(!soundOn)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();osc.type='triangle';osc.frequency.setValueAtTime(850,t);osc.frequency.exponentialRampToValueAtTime(360,t+.085);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.065,t+.008);gain.gain.exponentialRampToValueAtTime(.0001,t+.11);osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+.12)}catch{}}
async function give(hand,hidden=false){const c=draw();hand.push(c);arrival={hand:hand===player?'player':'dealer',index:hand.length-1};sound();render();await wait(730);arrival=null}
const suits=['♠','♥','♦','♣'];
function makeDeck(){let cards=[];for(const suit of suits)for(let rank=1;rank<=13;rank++)cards.push({suit,rank});for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}return cards}
function draw(){return deck.pop()}
function value(hand){let total=0,aces=0;for(const c of hand){if(c.rank===1){aces++;total+=11}else total+=Math.min(c.rank,10)}while(total>21&&aces){total-=10;aces--}return total}
function blackjack(hand){return hand.length===2&&value(hand)===21}
function cardHtml(c,hidden=false,arriving=false){if(hidden)return '<div class="card back '+(arriving?'arriving':'')+'" aria-label="Hidden card"></div>';const rank=({1:'A',11:'J',12:'Q',13:'K'})[c.rank]||c.rank;return '<div class="card '+('♥♦'.includes(c.suit)?'red':'')+'"><span>'+rank+c.suit+'</span><span class="bottom">'+rank+c.suit+'</span></div>'}
function save(){localStorage.setItem(KEY,JSON.stringify({balance,wins}))}
function render(){ $('balance').textContent=balance;$('wins').textContent=wins;$('currentBet').textContent=bet;$('player').innerHTML=player.map((c,i)=>cardHtml(c,false,arrival?.hand==='player'&&arrival.index===i)).join('');$('dealer').innerHTML=dealer.map((c,i)=>cardHtml(c,active&&i===1,arrival?.hand==='dealer'&&arrival.index===i)).join('');$('playerScore').textContent=player.length?'('+value(player)+')':'';$('dealerScore').textContent=dealer.length?'('+(active?Math.min(dealer[0].rank,10):value(dealer))+')':'';$('dealBtn').disabled=active||busy;$('hitBtn').disabled=!active||busy;$('standBtn').disabled=!active||busy;$('doubleBtn').disabled=!active||busy||balance<bet||player.length!==2;$('bet').disabled=active||busy;save()}
function message(t){$('message').textContent=t}
function finish(result){active=false;if(result==='win'){balance+=bet*2;wins++;message('YOU WIN! +'+bet+' coins')}else if(result==='blackjack'){balance+=Math.floor(bet*2.5);wins++;message('BLACKJACK! 3:2 payout')}else if(result==='push'){balance+=bet;message('PUSH — bet returned')}else message('DEALER WINS — try again');render()}
async function start(){if(active||busy)return;const amount=Number($('bet').value);if(!Number.isSafeInteger(amount)||amount<10||amount>balance){message('Enter a valid bet (min 10) within your balance');return}busy=true;bet=amount;balance-=bet;deck=makeDeck();player=[];dealer=[];active=true;message('Dealing cards…');render();await give(player);await give(dealer);await give(player);await give(dealer,true);busy=false;if(blackjack(player)||blackjack(dealer)){if(blackjack(player)&&blackjack(dealer))finish('push');else finish(blackjack(player)?'blackjack':'lose')}else{message('Hit, Stand, or Double');render()}}
async function hit(){if(!active||busy)return;busy=true;await give(player);busy=false;if(value(player)>21)finish('lose');else{message('Your move');render()}}
async function stand(){if(!active||busy)return;busy=true;message('Dealer reveals cards…');render();await wait(650);while(value(dealer)<17){await give(dealer)}busy=false;const p=value(player),d=value(dealer);finish(d>21||p>d?'win':p===d?'push':'lose')}
async function double(){if(!active||busy||balance<bet||player.length!==2)return;balance-=bet;bet*=2;busy=true;await give(player);busy=false;if(value(player)>21)finish('lose');else await stand()}
$('dealBtn').onclick=start;$('hitBtn').onclick=hit;$('standBtn').onclick=stand;$('doubleBtn').onclick=double;$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF';$('soundBtn').setAttribute('aria-pressed',String(soundOn));if(soundOn)sound()};render();
</script></body></html>
